[project]
name = "ecommerce-copywriting-assistant"
version = "0.1.0"
description = "AI e-commerce copywriting assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.54.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 180
timeout_method = "thread"
markers = [
    "integration: live tests that call OpenRouter/OpenAI (need API key)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
