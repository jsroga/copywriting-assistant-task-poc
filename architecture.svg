<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>AI copywriting assistant, Strands variant</title>
<desc>Same adapters, same domain and same LLMClient port; only the orchestration layer is replaced by the Strands agent runtime on branch feat/strands.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.t { font-size: 14px; font-weight: 400; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
</defs>

<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>

<text class="th" x="40" y="42" fill="#2C2C2A" style="font-size:18px">AI copywriting assistant — Strands variant</text>
<text class="ts" x="40" y="62" fill="#5F5E5A">Branch feat/strands. Only the orchestration layer is swapped; adapters, domain and port stay identical.</text>

<g transform="translate(0,64)">

<rect x="240" y="30" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Web client · Next.js</text>

<line x1="320" y1="76" x2="320" y2="104" class="arr" marker-end="url(#arrow)"/>
<path d="M360 104 L360 90 L470 90 L470 62" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="478" y="90" fill="#5F5E5A">SSE tokens back</text>

<rect x="200" y="110" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="#0C447C">HTTP API · FastAPI, SSE</text>
<text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central" fill="#185FA5">driving adapter · unchanged</text>

<line x1="340" y1="168" x2="340" y2="198" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="204" width="600" height="200" rx="20" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="th" x="60" y="226" dominant-baseline="central" fill="#2C2C2A">Application core</text>
<text class="ts" x="60" y="244" dominant-baseline="central" fill="#5F5E5A">no transport, no I/O · vendor runtime inside</text>

<rect x="60" y="256" width="350" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="th" x="235" y="276" text-anchor="middle" dominant-baseline="central" fill="#712B13">Strands agent runtime</text>
<text class="ts" x="235" y="296" text-anchor="middle" dominant-baseline="central" fill="#993C1D">tools, policy, lifecycle guard hooks</text>

<rect x="430" y="256" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="525" y="276" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">SessionStore</text>
<text class="ts" x="525" y="296" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">concrete class, no port</text>

<line x1="412" y1="284" x2="426" y2="284" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="314" x2="235" y2="332" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="336" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="356" text-anchor="middle" dominant-baseline="central" fill="#085041">Domain · pure functions, unchanged</text>
<text class="ts" x="340" y="376" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">gate, reducer, questions, validation rules</text>

<line x1="340" y1="406" x2="340" y2="436" class="arr" marker-end="url(#arrow)"/>

<rect x="230" y="440" width="220" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="461" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Port · LLMClient</text>

<path d="M240 516 L240 500 L290 500 L290 484" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M460 516 L460 500 L400 500 L400 484" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect x="140" y="518" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="240" y="538" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">OpenAI client</text>
<text class="ts" x="240" y="558" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">unchanged</text>

<rect x="360" y="518" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="460" y="538" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">FakeLLMClient</text>
<text class="ts" x="460" y="558" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">unchanged</text>

<text class="ts" x="60" y="598" fill="#993C1D">Thick outline: the only box that differs from branch main</text>
<text class="ts" x="60" y="618" fill="#5F5E5A">Dashed line: source dependency, points inward</text>

</g>
</svg>
